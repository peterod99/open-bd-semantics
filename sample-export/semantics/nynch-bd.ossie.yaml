# Nynch business-development definitions, in Apache Ossie format.
#
# This is the one place Nynch says what its business-development words mean:
# which stage a person is at, how warm a relationship is, whether an
# opportunity is open, won or lost, and what counts as qualified. The same
# rules run inside the product (database triggers, the relationship sweep,
# the contact contract) and this file is checked against them by
# tests/unit/ossieSemanticsValidation.test.ts, so a definition cannot drift
# from the rule it describes.
#
# Format: Apache Ossie core spec 0.2.0.dev0 (the flat document shape). The
# 0.1.1 release variant is generated by semantics/export-ossie-0.1.1.mjs; see
# semantics/README.md. Column names are the live PostgreSQL columns; every
# expression is ANSI SQL over the dataset's source.
version: 0.2.0.dev0
name: nynch_business_development
description: >-
  Nynch's relationship-led business development model: people, the accounts
  they work for, the opportunities in play, and the signals that point at the
  next one. Definitions are canonical (one meaning per word), raw labels are
  kept beside them, and nothing here is inferred from a stage name.
ai_context:
  instructions: >-
    Use lifecycle_stage, not lead_status, to say where a person is in the
    relationship; lead_status is the raw label someone typed or synced and
    only maps to meaning through the lifecycle_stage_map dataset. Use
    relationship_warmth_tier for how warm a relationship is and treat NULL as
    "no two-way contact ever recorded", never as cold. An opportunity's
    status comes from its outcome, never from the name or type of the stage
    it sits in: won opportunities live in client-delivery stages by design.
    "Deals" and "opportunities" are the same thing on two rails; signals
    (revenue_opportunities) are AI-detected openings, not pipeline records.
  synonyms:
    - business development
    - relationship-led growth
    - pipeline
  examples:
    - Which clients have we not spoken to in 90 days?
    - How many open opportunities are qualified?
    - Who are our hot relationships at accounts with no open opportunity?

datasets:
  - name: people
    source: public.contacts
    primary_key: [id]
    description: >-
      A person Nynch has a relationship with. One row per person per
      workspace; merged duplicates keep their row with merged_into_id set and
      soft-deleted people keep theirs with deleted_at set.
    ai_context:
      synonyms: [contacts, relationships, leads, prospects]
      instructions: >-
        Filter deleted_at IS NULL and merged_into_id IS NULL for the live book.
    fields:
      - name: id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: id }] }
        datatype: String
        description: Person identifier (UUID).
      - name: workspace_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: workspace_id }] }
        datatype: String
        description: The workspace (tenant) the person belongs to.
      - name: name
        expression: { dialects: [{ dialect: ANSI_SQL, expression: name }] }
        datatype: String
        description: Full name as written.
      - name: primary_email
        expression: { dialects: [{ dialect: ANSI_SQL, expression: primary_email }] }
        datatype: String
        description: The email Nynch treats as the person's main address.
      - name: company_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: company_id }] }
        datatype: String
        description: The account (companies.id) the person currently works for, when known.
      - name: owner_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: owner_id }] }
        datatype: String
        description: The teammate who owns the relationship.
      - name: lead_status
        expression: { dialects: [{ dialect: ANSI_SQL, expression: lead_status }] }
        datatype: String
        label: raw label
        description: >-
          The raw status label exactly as a person, a CSV import, HubSpot or
          Zapier wrote it. Free text; it is never rewritten by derivation and
          moves only when a writer changes the status on purpose. Carries no
          meaning on its own: read lifecycle_stage instead.
        ai_context:
          instructions: Never test this field for meaning (for example lead_status = 'customer'); use lifecycle_stage.
      - name: lifecycle_stage
        expression: { dialects: [{ dialect: ANSI_SQL, expression: lifecycle_stage }] }
        datatype: String
        label: canonical stage
        description: >-
          Where the person is in the relationship, as one of seven canonical
          stages: lead (a person we want a relationship with and have not yet
          qualified), qualified (a fit for what we sell, with a reason to
          talk), opportunity (an active commercial conversation, usually with
          a proposal), client (buying from us now or in the past), partner (a
          referrer, advocate or collaborator rather than a buyer), lost (a
          conversation that ended without a sale) and dormant (a relationship
          deliberately parked). Derived on every write from lead_status
          through the lifecycle_stage_map dataset; a write that sets the stage
          directly wins for that write. NULL means no stage is recorded
          (lead_status is null or an unmapped label), never "lead".
        ai_context:
          synonyms: [status, contact status, relationship stage]
        custom_extensions:
          - vendor_name: NYNCH
            data: '{"canonical_values": ["lead", "qualified", "opportunity", "client", "partner", "lost", "dormant"], "null_means": "no stage recorded", "derived_from": "lead_status via lifecycle_stage_map", "is_client": "lifecycle_stage = ''client''"}'
      - name: relationship_warmth_tier
        expression: { dialects: [{ dialect: ANSI_SQL, expression: relationship_warmth_tier }] }
        datatype: String
        description: >-
          How warm the relationship is, computed every fifteen minutes from
          connection_strength and the most recent two-way touch (the older of
          the last inbound and last outbound message, per channel, taking the
          most recent channel). hot: strength of 50 or more and a two-way
          touch within 30 days. warm: strength of 25 or more, or a two-way
          touch within 90 days. cold: a two-way touch exists but neither
          condition holds. NULL: no two-way contact has ever been recorded;
          this is not cold, it is unknown.
        ai_context:
          instructions: Treat NULL as "no two-way contact recorded", never as cold.
        custom_extensions:
          - vendor_name: NYNCH
            data: '{"rule": {"hot": "connection_strength >= 50 AND two_way_touch_within_days <= 30", "warm": "connection_strength >= 25 OR two_way_touch_within_days <= 90", "cold": "a two-way touch exists and neither holds", "null": "no two-way contact ever recorded"}, "thresholds": {"HOT_MIN_STRENGTH": 50, "HOT_MAX_DAYS": 30, "WARM_MIN_STRENGTH": 25, "WARM_MAX_DAYS": 90}, "computed_by": "run_relationship_signal_sweep on the connection-strength-sweep cron, 400 contacts per 15 minutes"}'
      - name: connection_strength
        expression: { dialects: [{ dialect: ANSI_SQL, expression: connection_strength }] }
        datatype: Integer
        description: A 0 to 100 score of how much real contact there has been, recomputed every fifteen minutes; direction-blind.
      - name: last_activity_at
        expression: { dialects: [{ dialect: ANSI_SQL, expression: last_activity_at }] }
        datatype: DateTimeTz
        dimension: { is_time: true }
        description: When the last recorded relationship activity happened. NULL means none recorded; never substitute created_at or updated_at.
      - name: created_at
        expression: { dialects: [{ dialect: ANSI_SQL, expression: created_at }] }
        datatype: DateTimeTz
        dimension: { is_time: false }
        description: When the record was created in Nynch (an audit timestamp, not an activity).
      - name: deleted_at
        expression: { dialects: [{ dialect: ANSI_SQL, expression: deleted_at }] }
        datatype: DateTimeTz
        dimension: { is_time: false }
        description: Soft-delete marker; NULL for live people.
      - name: merged_into_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: merged_into_id }] }
        datatype: String
        description: Set when this row was merged into another person; the surviving row is the one to read.

  - name: accounts
    source: public.companies
    primary_key: [id]
    description: An organisation people work for and opportunities belong to. One row per account per workspace.
    ai_context:
      synonyms: [companies, organisations, firms, clients when account_type says so]
    fields:
      - name: id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: id }] }
        datatype: String
        description: Account identifier (UUID).
      - name: workspace_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: workspace_id }] }
        datatype: String
        description: The workspace the account belongs to.
      - name: name
        expression: { dialects: [{ dialect: ANSI_SQL, expression: name }] }
        datatype: String
        description: Account name as written.
      - name: domain
        expression: { dialects: [{ dialect: ANSI_SQL, expression: domain }] }
        datatype: String
        description: Primary web domain, used to match people to the account.
      - name: industry
        expression: { dialects: [{ dialect: ANSI_SQL, expression: industry }] }
        datatype: String
        description: Industry label as enriched or typed.
      - name: owner_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: owner_id }] }
        datatype: String
        description: The teammate who owns the account.
      - name: account_type
        expression: { dialects: [{ dialect: ANSI_SQL, expression: account_type }] }
        datatype: String
        description: What the account is to Nynch (for example prospect or client), as the product records it.
      - name: market_tier
        expression: { dialects: [{ dialect: ANSI_SQL, expression: market_tier }] }
        datatype: String
        description: The commercial tier the workspace assigned (its own vocabulary); NULL when unassessed.
      - name: last_activity_at
        expression: { dialects: [{ dialect: ANSI_SQL, expression: last_activity_at }] }
        datatype: DateTimeTz
        dimension: { is_time: true }
        description: When the last recorded activity with anyone at the account happened; NULL means none recorded.
      - name: deleted_at
        expression: { dialects: [{ dialect: ANSI_SQL, expression: deleted_at }] }
        datatype: DateTimeTz
        dimension: { is_time: false }
        description: Soft-delete marker; NULL for live accounts.

  - name: opportunities
    source: >-
      SELECT id, workspace_id, 'deals' AS rail, title, company_id, primary_contact_id,
             owner_id, value, currency, stage, stage_type, outcome, close_date,
             champ_qualification, last_activity_at, created_at, deleted_at
      FROM public.deals
      UNION ALL
      SELECT o.id, o.workspace_id, 'opportunities' AS rail, o.name AS title, o.company_id,
             o.contact_id AS primary_contact_id, o.user_id AS owner_id, o.estimated_value AS value,
             o.currency, ps.name AS stage, ps.stage_type, o.outcome, o.expected_close_date AS close_date,
             NULL AS champ_qualification, o.last_activity_at, o.created_at, o.deleted_at
      FROM public.opportunities o
      LEFT JOIN public.pipeline_stages ps ON ps.id = o.stage_id
    primary_key: [id]
    description: >-
      A commercial conversation that could end in a sale. Nynch has two
      physical rails with one meaning: deals (the live rail) and
      opportunities (a retiring rail, frozen; 27 rows). The rail column says
      which; nothing else differs in meaning. AI-detected openings are not
      here, they are signals.
    ai_context:
      synonyms: [deals, pipeline, open conversations, proposals]
      instructions: >-
        Status comes from outcome, never from stage or stage_type: won
        opportunities are moved into client-delivery stages whose stage_type
        is active, by design. "Deal" and "opportunity" mean the same thing.
    fields:
      - name: id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: id }] }
        datatype: String
        description: Opportunity identifier (UUID), unique across both rails.
      - name: workspace_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: workspace_id }] }
        datatype: String
        description: The workspace the opportunity belongs to.
      - name: rail
        expression: { dialects: [{ dialect: ANSI_SQL, expression: rail }] }
        datatype: String
        description: Which physical table the row comes from, deals or opportunities. Same meaning either way.
      - name: title
        expression: { dialects: [{ dialect: ANSI_SQL, expression: title }] }
        datatype: String
        description: What the opportunity is called.
      - name: company_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: company_id }] }
        datatype: String
        description: The account the opportunity is with.
      - name: primary_contact_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: primary_contact_id }] }
        datatype: String
        description: The main person in the conversation.
      - name: owner_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: owner_id }] }
        datatype: String
        description: The teammate running the opportunity.
      - name: value
        expression: { dialects: [{ dialect: ANSI_SQL, expression: value }] }
        datatype: Decimal
        description: Expected value in the opportunity's currency; NULL when not yet quantified (never zero by default).
      - name: currency
        expression: { dialects: [{ dialect: ANSI_SQL, expression: currency }] }
        datatype: String
        description: ISO 4217 code for value.
      - name: stage
        expression: { dialects: [{ dialect: ANSI_SQL, expression: stage }] }
        datatype: String
        description: The workspace's own stage name. Workspaces name stages freely; read stage_type for the role and outcome for the result.
      - name: stage_type
        expression: { dialects: [{ dialect: ANSI_SQL, expression: stage_type }] }
        datatype: String
        description: >-
          The role of the current stage: active, won or lost. Every custom
          stage carries one. It is a position on a board, not the result:
          a won opportunity sits in an active client-delivery stage.
      - name: outcome
        expression: { dialects: [{ dialect: ANSI_SQL, expression: outcome }] }
        datatype: String
        description: >-
          The recorded result: won, lost, no_decision, or pending (a close
          awaiting review). NULL means the conversation is still open. Written
          only through the reviewed close contracts, never by moving a card.
      - name: status
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: >-
                CASE outcome WHEN 'won' THEN 'won' WHEN 'lost' THEN 'lost'
                WHEN 'no_decision' THEN 'no_decision' WHEN 'pending' THEN 'pending'
                ELSE 'open' END
        datatype: String
        label: derived
        description: >-
          Whether the opportunity is open, won, lost, no_decision or pending,
          derived from outcome alone. Never derived from stage_type: a Lost
          stage with no recorded outcome is still open and is queued for a
          manager to record the outcome.
        custom_extensions:
          - vendor_name: NYNCH
            data: '{"derived_from": "outcome", "never_from": "stage_type", "open_means": "outcome IS NULL", "repair": "live Lost-stage rows with no outcome go to deal_outcome_repair_queue for manager review"}'
      - name: is_qualified
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: >-
                JSON_VALUE(champ_qualification, '$.challenges') = 'confirmed'
                AND JSON_VALUE(champ_qualification, '$.authority') = 'confirmed'
                AND JSON_VALUE(champ_qualification, '$.money') = 'confirmed'
                AND JSON_VALUE(champ_qualification, '$.prioritization') = 'confirmed'
        datatype: Boolean
        label: derived
        description: >-
          True when all four SPEC qualification elements are confirmed on the
          opportunity: Strategic Commitment (recorded as challenges), Problem
          Resonance (authority), Economic Fit (money) and Committee Gravity
          (prioritization). Each element is unknown, confirmed or
          not_confirmed; anything short of four confirmed is not qualified.
          Opportunities on the retiring rail carry no qualification and are
          never qualified.
        custom_extensions:
          - vendor_name: NYNCH
            data: '{"elements": {"challenges": "Strategic Commitment", "authority": "Problem Resonance", "money": "Economic Fit", "prioritization": "Committee Gravity"}, "element_values": ["unknown", "confirmed", "not_confirmed"], "rule": "all four confirmed"}'
      - name: close_date
        expression: { dialects: [{ dialect: ANSI_SQL, expression: close_date }] }
        datatype: Date
        dimension: { is_time: true }
        description: The expected or actual close date as recorded.
      - name: last_activity_at
        expression: { dialects: [{ dialect: ANSI_SQL, expression: last_activity_at }] }
        datatype: DateTimeTz
        dimension: { is_time: true }
        description: When the last recorded activity on the opportunity happened; NULL means none recorded.
      - name: created_at
        expression: { dialects: [{ dialect: ANSI_SQL, expression: created_at }] }
        datatype: DateTimeTz
        dimension: { is_time: false }
        description: When the record was created (audit timestamp).
      - name: deleted_at
        expression: { dialects: [{ dialect: ANSI_SQL, expression: deleted_at }] }
        datatype: DateTimeTz
        dimension: { is_time: false }
        description: Soft-delete marker; NULL for live opportunities.

  - name: signals
    source: public.revenue_opportunities
    primary_key: [id]
    description: >-
      An AI-detected opening (expansion, upsell, referral, re-engagement and
      the like) found in conversations and activity. A signal is a suggestion
      about a person, account or opportunity; it is not an opportunity until
      someone opens one.
    ai_context:
      synonyms: [revenue opportunities, openings, triggers]
      instructions: Do not count signals as pipeline. They point at where an opportunity might be opened.
    fields:
      - name: id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: id }] }
        datatype: String
        description: Signal identifier (UUID).
      - name: opportunity_type
        expression: { dialects: [{ dialect: ANSI_SQL, expression: opportunity_type }] }
        datatype: String
        description: The kind of opening the AI detected (for example expansion, upsell, referral).
      - name: status
        expression: { dialects: [{ dialect: ANSI_SQL, expression: status }] }
        datatype: String
        description: Where the signal is in review (as the product records it); not an opportunity status.
      - name: confidence_score
        expression: { dialects: [{ dialect: ANSI_SQL, expression: confidence_score }] }
        datatype: Float
        description: The model's confidence in the signal, 0 to 1.
      - name: estimated_value
        expression: { dialects: [{ dialect: ANSI_SQL, expression: estimated_value }] }
        datatype: Decimal
        description: A rough value if the opening became an opportunity; NULL when unknown.
      - name: contact_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: contact_id }] }
        datatype: String
        description: The person the signal is about, when there is one.
      - name: company_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: company_id }] }
        datatype: String
        description: The account the signal is about, when there is one.
      - name: deal_id
        expression: { dialects: [{ dialect: ANSI_SQL, expression: deal_id }] }
        datatype: String
        description: The opportunity (deals rail) the signal relates to, when there is one.
      - name: source_date
        expression: { dialects: [{ dialect: ANSI_SQL, expression: source_date }] }
        datatype: DateTimeTz
        dimension: { is_time: true }
        description: When the evidence behind the signal happened.
      - name: opportunity_summary
        expression: { dialects: [{ dialect: ANSI_SQL, expression: opportunity_summary }] }
        datatype: String
        description: The AI's one-paragraph description of the opening.

  - name: lifecycle_stage_map
    source: public.lead_status_lifecycle_map
    primary_key: [raw_label]
    description: >-
      The global map from raw lead_status labels (lower-cased and trimmed) to
      canonical lifecycle stages. Every label a writer has used maps to
      exactly one stage; exactly one label per stage is the default a
      stage-only writer mirrors into lead_status. A label not in this map
      derives no stage.
    ai_context:
      instructions: Read-only reference data; the product derives lifecycle_stage through it on every write.
    fields:
      - name: raw_label
        expression: { dialects: [{ dialect: ANSI_SQL, expression: raw_label }] }
        datatype: String
        description: The raw label, lower-cased and trimmed.
      - name: lifecycle_stage
        expression: { dialects: [{ dialect: ANSI_SQL, expression: lifecycle_stage }] }
        datatype: String
        description: The canonical stage the label means.
      - name: is_default
        expression: { dialects: [{ dialect: ANSI_SQL, expression: is_default }] }
        datatype: Boolean
        description: True for the one label per stage that a stage-only writer mirrors into lead_status.
    custom_extensions:
      - vendor_name: NYNCH
        data: '{"seed": {"new": "lead", "new lead": "lead", "lead": "lead", "prospect": "lead", "contacted": "lead", "nurture": "lead", "nurturing": "lead", "subscriber": "lead", "marketingqualifiedlead": "lead", "qualified": "qualified", "engaged": "qualified", "salesqualifiedlead": "qualified", "proposal": "opportunity", "negotiation": "opportunity", "opportunity": "opportunity", "customer": "client", "client": "client", "won": "client", "partner": "partner", "advocate": "partner", "evangelist": "partner", "lost": "lost", "dormant": "dormant"}, "defaults": {"lead": "new", "qualified": "qualified", "opportunity": "proposal", "client": "customer", "partner": "partner", "lost": "lost", "dormant": "dormant"}}'

relationships:
  - name: people_work_for_accounts
    from: people
    to: accounts
    from_columns: [company_id]
    to_columns: [id]
  - name: opportunities_belong_to_accounts
    from: opportunities
    to: accounts
    from_columns: [company_id]
    to_columns: [id]
  - name: opportunities_have_a_primary_person
    from: opportunities
    to: people
    from_columns: [primary_contact_id]
    to_columns: [id]
  - name: signals_point_at_people
    from: signals
    to: people
    from_columns: [contact_id]
    to_columns: [id]
  - name: signals_point_at_accounts
    from: signals
    to: accounts
    from_columns: [company_id]
    to_columns: [id]
  - name: signals_point_at_opportunities
    from: signals
    to: opportunities
    from_columns: [deal_id]
    to_columns: [id]
  - name: people_stages_come_from_the_map
    from: people
    to: lifecycle_stage_map
    from_columns: [lead_status]
    to_columns: [raw_label]
    ai_context: The join is on the lower-cased, trimmed label; the product applies it on write, so lifecycle_stage already holds the answer.

metrics:
  - name: open_pipeline_value
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: SUM(CASE WHEN outcome IS NULL AND deleted_at IS NULL THEN value ELSE 0 END)
    datatype: Decimal
    description: Total value of live, open opportunities (outcome not yet recorded), in each opportunity's own currency; do not sum across currencies.
  - name: open_opportunity_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(CASE WHEN outcome IS NULL AND deleted_at IS NULL THEN 1 END)
    datatype: Integer
    description: Number of live opportunities with no recorded outcome.
  - name: client_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(CASE WHEN lifecycle_stage = 'client' AND deleted_at IS NULL AND merged_into_id IS NULL THEN 1 END)
    datatype: Integer
    description: Number of live people at the client stage.
  - name: hot_relationship_count
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: COUNT(CASE WHEN relationship_warmth_tier = 'hot' AND deleted_at IS NULL AND merged_into_id IS NULL THEN 1 END)
    datatype: Integer
    description: Number of live people whose computed warmth tier is hot.

custom_extensions:
  - vendor_name: NYNCH
    data: '{"product": "Nynch", "definitions_version": "2026-10-20", "source_of_truth": {"lifecycle_stage": "supabase/migrations/20261225100000_contact_lifecycle_stage.sql", "relationship_warmth_tier": "supabase/migrations/20261225100100_relationship_warmth_tier_from_two_way_signal.sql", "opportunity_status": "supabase/migrations/20261225100200_deal_lost_stage_outcome_repair_queue.sql"}, "workspace_overrides": "none yet; per-workspace lifecycle labels will be merged here as a further NYNCH extension", "license": "Apache-2.0"}'
